name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff || { echo "::error::go.mod/go.sum are not tidy - run 'go mod tidy' and commit"; exit 1; }
      - name: Test
        run: go test -race -count=1 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
